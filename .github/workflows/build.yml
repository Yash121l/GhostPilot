name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (arm64)
          - name: macOS arm64
            os: macos-latest
            args: --mac --arm64
          # macOS — Intel (x64) cross-compiled on arm64 runner (macos-13 has long queue times)
          - name: macOS x64
            os: macos-latest
            args: --mac --x64
          # Windows — x64
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          # Linux — x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Rebuild native modules (better-sqlite3, keytar) for the Electron ABI
      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build (electron-vite + electron-builder)
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Disable code signing for CI builds — only release workflow signs
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz
          retention-days: 7
          if-no-files-found: warn
