<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GhostPilot — Connecting…</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #0a0a0a; color: #f0f0f0;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.box {
  text-align: center; max-width: 420px; width: 100%;
  background: #111; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 48px 40px;
}
.icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.25);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px; font-size: 26px;
}
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
p { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 0; }
.spinner {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid rgba(99,102,241,0.3);
  border-top-color: #6366f1;
  animation: spin 0.8s linear infinite;
  display: inline-block; margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #f87171; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #6366f1; color: #fff;
  font-size: 14px; font-weight: 600;
  padding: 11px 22px; border-radius: 10px; border: none;
  cursor: pointer; margin-top: 20px; text-decoration: none;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.88; }
.note { font-size: 12px; color: #555; margin-top: 14px; }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Connecting to GhostPilot…</h1>
  <p id="msg">Opening the app to complete the connection.</p>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code  = params.get('code');
  var state = params.get('state');
  var error = params.get('error');
  var errorDesc = params.get('error_description');

  var spinner = document.getElementById('spinner');
  var title   = document.getElementById('title');
  var msg     = document.getElementById('msg');
  var box     = document.getElementById('box');

  function showError(text) {
    spinner.style.display = 'none';
    title.textContent = 'Connection failed';
    title.className = 'error';
    msg.textContent = text;
  }

  function showSuccess() {
    spinner.style.display = 'none';
    box.innerHTML =
      '<div class="icon">✓</div>' +
      '<h1>Connected!</h1>' +
      '<p>You can close this tab and return to GhostPilot.</p>';
  }

  if (error) {
    showError(errorDesc || error);
    return;
  }

  if (!code || !state) {
    showError('Missing code or state — this link may have expired. Try connecting again from the app.');
    return;
  }

  // Build the deep-link URL and fire it
  var deepLink = 'ghostpilot://oauth/callback?code=' +
    encodeURIComponent(code) + '&state=' + encodeURIComponent(state);

  // Attempt to open the app
  window.location.href = deepLink;

  // After a short delay, check if the page is still visible.
  // If the app opened, the tab will have blurred. If not, show a manual button.
  var opened = false;
  window.addEventListener('blur', function () { opened = true; });

  setTimeout(function () {
    if (opened) {
      showSuccess();
    } else {
      // App didn't open — show a manual button
      spinner.style.display = 'none';
      title.textContent = 'Open GhostPilot';
      msg.textContent = 'Click below to finish connecting. Make sure GhostPilot is running.';

      var btn = document.createElement('a');
      btn.href = deepLink;
      btn.className = 'btn';
      btn.innerHTML =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>' +
        'Open GhostPilot';
      box.appendChild(btn);

      var note = document.createElement('p');
      note.className = 'note';
      note.textContent = 'If the app does not open, make sure GhostPilot is installed and running.';
      box.appendChild(note);
    }
  }, 1500);
})();
</script>
</body>
</html>
